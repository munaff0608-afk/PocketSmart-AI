{% extends "base.html" %}
{% block title %}Home Planner{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">HOME INTERIOR</p><h1>Build a room plan 🏠</h1><p>Tell us what you need and we'll split the budget into useful categories.</p></div></div>
<form id="home-form" class="card form-card planner-form">
<label>Budget (₹)<input name="budget" type="number" min="1" required placeholder="30000"></label>
<label>Room type<select name="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option><option>Study Room</option></select></label>
<label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Industrial</option><option>Luxury</option></select></label>
<div class="grid three">
<label>Lights<input name="lights" type="number" min="0" value="2"></label>
<label>Fans<input name="fans" type="number" min="0" value="1"></label>
<label>Tables<input name="tables" type="number" min="0" value="1"></label>
</div>
<label>Notes<textarea name="notes" placeholder="Example: warm lighting, small room..."></textarea></label>
<button class="btn" type="submit">Generate Home Plan ✨</button>
</form>
<div id="result"></div>
{% endblock %}
